[project]
name = "patrowl-intel-mcp"
version = "0.2.0"
description = "MCP server exposing PatrowlIntel vulnerability intelligence (CVEs, EPSS, CISA KEV, public exploits, trending attacks)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Mattiocco", email = "nicolas.mattiocco@patrowl.io" }]
keywords = ["mcp", "model-context-protocol", "security", "cve", "vulnerability", "threat-intelligence", "epss", "cisa-kev", "patrowl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.8.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://intel.patrowl.io"
Repository = "https://github.com/Patrowl/PatrowlIntelMCP"
Issues = "https://github.com/Patrowl/PatrowlIntelMCP/issues"

[project.scripts]
patrowl-intel-mcp = "patrowl_intel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patrowl_intel_mcp"]
